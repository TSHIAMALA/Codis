# Les formulaires HTML de l'application utilisent des jetons CSRF classiques (session)
# vérifiés par App\EventSubscriber\CsrfProtectionSubscriber (id "app"),
# ainsi que "authenticate" (login) et "logout".
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
