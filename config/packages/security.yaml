security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api_login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            access_denied_handler: App\Security\AccessDeniedHandler
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                username_parameter: username
                password_parameter: password
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true

    # Codes de la table `role` préfixés par ROLE_ (voir Utilisateur::getRoles()).
    # ROLE_STAFF = tout le personnel interne ayant accès à l'interface web.
    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN_PAYS]
        ROLE_ADMIN_PAYS: [ROLE_RESPONSABLE_USINE, ROLE_GESTIONNAIRE_DEPOT, ROLE_DELEGUE, ROLE_CAISSIER]
        ROLE_DELEGUE: [ROLE_AGENT_COMMERCIAL]
        ROLE_AGENT_COMMERCIAL: [ROLE_STAFF]
        ROLE_RESPONSABLE_USINE: [ROLE_STAFF]
        ROLE_GESTIONNAIRE_DEPOT: [ROLE_STAFF]
        ROLE_CAISSIER: [ROLE_STAFF]

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/inscription, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
